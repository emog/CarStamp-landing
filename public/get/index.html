<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Get CarStamp</title>
<link rel="icon" href="/favicon.ico">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#14204B;color:#fff;
font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
main{padding:32px 20px;max-width:420px}
img.icon{width:96px;height:96px;border-radius:22px}
h1{font-size:28px;margin:18px 0 6px}
p{color:#C9D2EA;margin:0 0 24px}
a.btn{display:block;margin:12px auto;padding:14px 18px;border-radius:12px;background:#F4A63C;color:#14204B;
font-weight:700;text-decoration:none;max-width:300px}
a.btn.alt{background:#fff}
</style>
</head>
<body>
<main>
<img class="icon" src="/apple-touch-icon.png" alt="">
<h1>CarStamp</h1>
<p>The complete record of your car. Free for one car, no account, no ads.</p>
<a class="btn" id="ios" href="https://apps.apple.com/app/id6820775330?pt=122175632&amp;ct=get&amp;mt=8">Download on the App Store</a>
<a class="btn alt" id="android" href="https://play.google.com/store/apps/details?id=net.egeorgiev.carstamp&amp;referrer=utm_source%3Dweb%26utm_campaign%3Dget">Get it on Google Play</a>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var clean = function (v, d) { v = (v || '').replace(/[^A-Za-z0-9._-]/g, '').slice(0, 40); return v || d; };
  var c = clean(q.get('c'), 'get'), s = clean(q.get('s'), 'web');
  var ios = 'https://apps.apple.com/app/id6820775330?pt=122175632&ct=' + c + '&mt=8';
  var play = 'https://play.google.com/store/apps/details?id=net.egeorgiev.carstamp&referrer=' + encodeURIComponent('utm_source=' + s + '&utm_campaign=' + c);
  document.getElementById('ios').href = ios;
  document.getElementById('android').href = play;
  var ua = navigator.userAgent;
  var apple = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  if (apple) location.replace(ios);
  else if (/Android/.test(ua)) location.replace(play);
})();
</script>
</body>
</html>
